name: PostgreSQL mixed HTTP soak
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  soak:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: drevo_test
          POSTGRES_PASSWORD: local_ci_test
          POSTGRES_DB: drevo_migration_bench_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drevo_test -d drevo_migration_bench_admin"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: drevo_test
      PGPASSWORD: local_ci_test
      PGDATABASE: drevo_migration_bench_admin
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - name: Create a fresh benchmark database with an ordinary runtime role
        run: |
          node --input-type=module <<'NODE'
          import pg from 'pg';
          const client = new pg.Client();
          await client.connect();
          try {
            await client.query("CREATE ROLE drevo_runtime LOGIN PASSWORD 'local_runtime_test' NOSUPERUSER NOBYPASSRLS");
            await client.query('CREATE DATABASE drevo_migration_bench_http_soak OWNER drevo_runtime');
          } finally {
            await client.end();
          }
          NODE
      - name: Measure five minutes of two-backend traffic on 10000 people
        run: |
          set -euo pipefail
          PGUSER=drevo_runtime PGPASSWORD=local_runtime_test PGDATABASE=drevo_migration_bench_http_soak \
            node --experimental-strip-types ops/postgres/benchmark-http.ts 10000 300 | tee benchmark-http-soak.jsonl
      - name: Publish measured results and limits
        if: always()
        run: |
          {
            echo '### Two-backend PostgreSQL mixed HTTP soak'
            echo 'Synthetic 10000-person archive, five minutes, 12 HTTP readers plus writer, two backend processes, shared media, two fake AI turns and one competing background backup. This is a GitHub runner measurement, not production capacity or external AI latency.'
            echo '```json'
            if [ -f benchmark-http-soak.jsonl ]; then cat benchmark-http-soak.jsonl; fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
