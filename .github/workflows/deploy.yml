name: Deploy Drevo
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    uses: ./.github/workflows/postgres.yml
  prepare:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: drevo-prepare-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: bash -n ops/deploy.sh
      - name: Validate Nginx site
        run: |
          if ! command -v nginx >/dev/null; then
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$source" ]; then
                sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
              fi
            done
            sudo timeout 120 apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo timeout 120 apt-get install -y --no-install-recommends nginx -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          fi
          bash ops/check-nginx.sh
      - run: bash -n ops/backup.sh
      - run: bash -n ops/fetch-award-images.sh
      - run: bash -n ops/postgres/verify-restore.sh
      - run: bash -n ops/postgres/verify-physical-restore.sh
      - run: bash -n ops/postgres/setup-local-backup.sh
      - run: bash -n ops/postgres/setup-platform-backup.sh
      - run: bash -n ops/postgres/local-backup.sh
      - run: bash -n ops/postgres/local-backup-health.sh
      - run: bash -n ops/postgres/local-media-backup.sh
      - run: bash -n ops/postgres/local-media-backup-health.sh
      - run: bash -n ops/postgres/verify-local-media-backup.sh
      - run: bash -n ops/postgres/setup-local-media-backup.sh
      - run: bash -n ops/postgres/deploy-maintenance.sh
      - run: bash -n ops/postgres/cutover.sh
      - name: Restore prepared award images
        id: award-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/awards/**/*.png
          key: award-images-${{ hashFiles('ops/fetch-award-images.sh') }}
      - name: Prepare real PNG award images
        if: steps.award-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          bash ops/fetch-award-images.sh
      # HTTP-проверка публичной ссылки использует собранную HTML-оболочку.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Test all suites on Node 22
        # Node 22: ошибка IPC в node --test (nodejs/node#64061, #64706).
        # Прямой запуск оставляет каждый файл в отдельном процессе, без IPC runner.
        run: |
          for test_file in tests/*.test.ts; do
            node --experimental-strip-types "$test_file"
          done
      - run: npm run test:worker
      - name: Assemble the verified release
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          mkdir -p release/src release/public
          cp -R dist ops assets release/
          cp -R src/domain src/server src/shared release/src/
          cp -R public/data release/public/
          cp ops/runtime/package.json ops/runtime/package-lock.json release/
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("release/release.json", JSON.stringify({releaseId:process.env.RELEASE_ID}))'
          npm ci --prefix release --omit=dev --no-audit --no-fund
          tar -czf release.tar.gz release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-release
          path: release.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  deploy:
    needs: [prepare, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: drevo-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://mydrevo.org
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: verified-release
      - name: Extract verified release
        run: tar -xzf release.tar.gz
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' '[94.232.248.210]:4321 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG2C3d6j+K8FTcK6aoKhH7lTTfBWX2lp1hBFZp+I8nhV' > ~/.ssh/known_hosts
      - name: Upload isolated release
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          ssh -p 4321 -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@94.232.248.210 "mkdir -p /var/www/drevo.kiiko.ru/releases/$RELEASE_ID"
          rsync -az --no-owner --no-group --chmod=Dg+rwx,Dg+s,Do-rwx,Fg+rw,Fo-rwx \
            -e 'ssh -p 4321 -o BatchMode=yes -o StrictHostKeyChecking=yes' \
            release/ "deploy@94.232.248.210:/var/www/drevo.kiiko.ru/releases/$RELEASE_ID/"
      - name: Activate and check release
        env:
          RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}
        run: |
          ssh -p 4321 -o BatchMode=yes -o StrictHostKeyChecking=yes deploy@94.232.248.210 \
            "bash /var/www/drevo.kiiko.ru/releases/$RELEASE_ID/ops/deploy.sh $RELEASE_ID"
          curl --fail --retry 3 --silent --show-error https://mydrevo.org/api/health | python3 -c 'import json,sys; health=json.load(sys.stdin); assert health["ok"] is True and health.get("releaseId")==sys.argv[1]' "$RELEASE_ID"
          redirect=$(curl --fail --silent --show-error --output /dev/null \
            --write-out '%{http_code} %{redirect_url}' https://drevo.kiiko.ru/api/health)
          test "$redirect" = '301 https://mydrevo.org/api/health'
