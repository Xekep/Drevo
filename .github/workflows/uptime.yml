name: Drevo availability
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: drevo-availability
  cancel-in-progress: false
jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check public health without authentication
        run: |
          curl --fail --silent --show-error --max-time 10 --retry 2 --retry-delay 5 --retry-all-errors https://mydrevo.org/api/health > health.json
          python3 - <<'PY'
          import json
          with open('health.json') as response:
              payload = json.load(response)
          assert payload.get('ok') is True, 'Health response is not healthy'
          PY
