name: Drevo CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: drevo-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: bash -n ops/deploy.sh
      - run: bash -n ops/backup.sh
      - run: bash -n ops/fetch-award-images.sh
      - run: bash -n ops/check-mcp.sh
      - name: Restore prepared award images
        id: award-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/awards/**/*.png
          key: award-images-${{ hashFiles('ops/fetch-award-images.sh') }}
      - name: Prepare real PNG award images
        if: steps.award-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          bash ops/fetch-award-images.sh
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Test all suites on Node 22
        # Node 22: ошибка IPC в node --test (nodejs/node#64061, #64706).
        # Прямой запуск оставляет каждый файл в отдельном процессе, без IPC runner.
        run: |
          for test_file in tests/*.test.ts; do
            node --experimental-strip-types "$test_file"
          done
      - run: npm run test:worker
      - name: Install official MCP client for compatibility smoke
        run: npm install --no-save --package-lock=false @modelcontextprotocol/client@2.0.0
      - name: Test MCP with official TypeScript client
        run: node --experimental-strip-types tests/mcp-official-client-smoke.mjs
