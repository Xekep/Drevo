name: Drevo CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: drevo-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  pgbackrest_restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Restore a PostgreSQL 18 backup with pgBackRest
        run: |
          docker run --rm -v "$PWD:/work:ro" postgres:18-trixie bash -ec '
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends pgbackrest python3
            pgbackrest version
            exec gosu postgres bash /work/tests/pgbackrest-restore-smoke.sh
          '
  postgres:
    uses: ./.github/workflows/postgres.yml
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --prefix ops/runtime --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: bash -n ops/deploy.sh
      - run: python3 -B -m unittest discover -s tests -p 'test_release_identity.py'
      - name: Validate Nginx site
        run: |
          if ! command -v nginx >/dev/null; then
            for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
              if [ -f "$source" ]; then
                sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#https://archive.ubuntu.com/ubuntu#g' "$source"
              fi
            done
            sudo timeout 120 apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
            sudo timeout 120 apt-get install -y --no-install-recommends nginx -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20
          fi
          bash ops/check-nginx.sh
      - run: bash -n ops/backup.sh
      - run: bash -n ops/fetch-award-images.sh
      - run: bash -n ops/postgres/verify-restore.sh
      - run: bash -n ops/postgres/verify-physical-restore.sh
      - run: bash -n ops/postgres/restore-pgbackrest-physical.sh
      - run: bash -n ops/postgres/run-restore-rehearsal.sh
      - run: bash -n ops/postgres/setup-restore-rehearsal.sh
      - run: python3 -B -m unittest discover -s tests -p 'test_restore_preflight.py'
      - run: python3 -B -m unittest discover -s tests -p 'test_verify_media_archive.py'
      - run: python3 -B -m unittest discover -s tests -p 'test_stage_ai_provider_key.py'
      - run: systemd-analyze calendar '*-*-01 06:30:00 UTC'
      - run: bash -n ops/postgres/setup-local-backup.sh
      - run: bash -n ops/postgres/setup-platform-backup.sh
      - run: bash -n ops/postgres/local-backup.sh
      - run: bash -n ops/postgres/local-backup-health.sh
      - run: bash -n ops/postgres/local-media-backup.sh
      - run: bash -n ops/postgres/media-backup-paths.sh
      - run: bash tests/media-backup-paths.sh
      - run: bash -n ops/postgres/local-media-backup-health.sh
      - run: bash -n ops/postgres/verify-local-media-backup.sh
      - run: bash -n ops/postgres/setup-local-media-backup.sh
      - run: bash -n ops/postgres/deploy-maintenance.sh
      - run: bash -n ops/postgres/cutover.sh
      - name: Restore prepared award images
        id: award-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: public/awards/**/*.png
          key: award-images-${{ hashFiles('ops/fetch-award-images.sh') }}
      - name: Prepare real PNG award images
        if: steps.award-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends imagemagick
          bash ops/fetch-award-images.sh
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-build
          path: |
            dist
            public/awards
          retention-days: 1
          if-no-files-found: error
  e2e:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-build
          path: .
      - run: npx playwright install --with-deps chromium
      - run: npm run prepare:models
      - name: Repeat native tab gestures in full Chromium
        if: matrix.shard == 1
        run: npm run test:e2e -- tests/e2e/native-tabs.spec.ts --repeat-each=25 --workers=4
      # Each VM owns its e2e-server and SQLite. No shard shares mutable fixtures.
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: test-results
          retention-days: 3
  unit:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: e2e-build
          path: .
      - name: Test all suites on Node 22
        # Node 22: ошибка IPC в node --test (nodejs/node#64061, #64706).
        # Прямой запуск оставляет каждый файл в отдельном процессе, без IPC runner.
        run: |
          for test_file in tests/*.test.ts; do
            node --experimental-strip-types "$test_file"
          done
      - run: npm run test:worker
  check:
    if: always()
    needs: [prepare, e2e, unit]
    runs-on: ubuntu-latest
    steps:
      - name: Require every test group to succeed
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          UNIT_RESULT: ${{ needs.unit.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$E2E_RESULT" = success
          test "$UNIT_RESULT" = success
