name: Drevo CI
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: drevo-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Test all suites on Node 22
        # Node 22: ошибка IPC в node --test (nodejs/node#64061, #64706).
        # Прямой запуск оставляет каждый файл в отдельном процессе, без IPC runner.
        run: |
          for test_file in tests/*.test.ts; do
            node --experimental-strip-types "$test_file"
          done
      - run: npm run test:worker
