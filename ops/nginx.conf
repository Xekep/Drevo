map $uri $drevo_log_uri {
    ~^/s/ /s/[redacted];
    ~^/api/shared/ /api/shared/[redacted];
    default $uri;
}
log_format drevo '$remote_addr - $remote_user [$time_local] '
                 '"$request_method $drevo_log_uri $server_protocol" $status $body_bytes_sent '
                 '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name drevo.kiiko.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://drevo.kiiko.ru$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name drevo.kiiko.ru;
    ssl_certificate /etc/letsencrypt/live/drevo.kiiko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drevo.kiiko.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/json application/javascript text/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log /var/log/nginx/drevo.kiiko.ru/access.log drevo;
    error_log /var/log/nginx/drevo.kiiko.ru/error.log;
    location ~ /\. { deny all; }
    location = /api/restore/preview {
        client_max_body_size 12g;
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host drevo.kiiko.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host drevo.kiiko.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
