server {
    listen 80;
    listen [::]:80;
    server_name drevo.kiiko.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://drevo.kiiko.ru$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name drevo.kiiko.ru;
    ssl_certificate /etc/letsencrypt/live/drevo.kiiko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drevo.kiiko.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    access_log /var/log/nginx/drevo.kiiko.ru/access.log;
    error_log /var/log/nginx/drevo.kiiko.ru/error.log;
    location ~ /\. { deny all; }
    location = /api/restore/preview {
        client_max_body_size 128m;
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host drevo.kiiko.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host drevo.kiiko.ru;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
