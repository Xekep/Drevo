map $uri $drevo_log_uri {
    ~^/s/ /s/[redacted];
    ~^/api/shared/ /api/shared/[redacted];
    ~^/a/[^/]+/s/ /s/[redacted];
    ~^/a/[^/]+/api/shared/ /api/shared/[redacted];
    ~^/join/ /join/[redacted];
    default $uri;
}
log_format drevo '$remote_addr - $remote_user [$time_local] '
                 '"$request_method $drevo_log_uri $server_protocol" $status $body_bytes_sent '
                 '"$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name mydrevo.org;
    access_log /var/log/nginx/drevo.kiiko.ru/access.log drevo;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://mydrevo.org$request_uri; }
}
server {
    listen 80;
    listen [::]:80;
    server_name drevo.kiiko.ru;
    access_log /var/log/nginx/drevo.kiiko.ru/access.log drevo;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; default_type text/plain; }
    location / { return 301 https://mydrevo.org$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name drevo.kiiko.ru;
    ssl_certificate /etc/letsencrypt/live/drevo.kiiko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drevo.kiiko.ru/privkey.pem;
    access_log /var/log/nginx/drevo.kiiko.ru/access.log drevo;
    return 301 https://mydrevo.org$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mydrevo.org;
    ssl_certificate /etc/letsencrypt/live/mydrevo.org/fullchain.pem;
    # Root creates this marker only for a controlled database cutover.
    if (-f /run/drevo-maintenance) { return 503; }
    ssl_certificate_key /etc/letsencrypt/live/mydrevo.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 51m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/json application/javascript text/javascript image/svg+xml;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    proxy_hide_header Referrer-Policy;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; connect-src 'self'; font-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    access_log /var/log/nginx/drevo.kiiko.ru/access.log drevo;
    error_log /var/log/nginx/drevo.kiiko.ru/error.log;
    location ~ /\. { deny all; }
    location = /api/backups {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }
    location ^~ /api/backups/ {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }
    location ~ "^/a/[A-Za-z0-9][A-Za-z0-9-]{2,63}/api/backups/" {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }
    location = /api/restore/apply {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
    }
    location ~ "^/a/[A-Za-z0-9][A-Za-z0-9-]{2,63}/api/restore/apply$" {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
    }
    location = /api/restore/preview {
        client_max_body_size 12g;
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location ~ "^/a/[A-Za-z0-9][A-Za-z0-9-]{2,63}/api/restore/preview$" {
        client_max_body_size 12g;
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
    location = /api/gedcom/preview {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location ~ "^/a/[A-Za-z0-9][A-Za-z0-9-]{2,63}/api/gedcom/preview$" {
        client_max_body_size 512m;
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location = /api/gedcom/export {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
    location ~ "^/a/[A-Za-z0-9][A-Za-z0-9-]{2,63}/api/gedcom/export$" {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 900s;
        proxy_buffering off;
    }
    location = /api/offline/export {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_buffering off;
    }
    location = /mcp {
        proxy_pass http://127.0.0.1:3107;
        proxy_http_version 1.1;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location / {
        proxy_pass http://127.0.0.1:3107;
        proxy_set_header Host mydrevo.org;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
